<title>AdMate Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* AdMate prototype: one engine, three views (Beginner · Understand, Intermediate · Optimize,
   Advanced · Scale). Brand tokens from app/globals.css. Colour = priority (High red,
   Medium amber, Low grey); good/bad is always paired with an arrow, icon or word. */
:root {
  --bg: #ffffff; --surface: #f6f6f9; --surface-2: #eeeef4; --line: #e3e3ec;
  --fg: #0a0a13; --muted: #55556a; --faint: #8a8a9e;
  --violet: #6a3fe8; --violet-soft: #efeafe;
  --signal: #c2e233; --signal-ink: #0a0a13;
  --hi: #d23b3b; --hi-soft: #fcecec; --mid: #a35f00; --mid-soft: #fbf0dc; --lo: #62627a; --lo-soft: #eeeef4;
  --good: #1f7a52; --good-soft: #e3f4ec;
  --c2: #0f6fa8; --c3: #a35f00;
  /* Categories (goals, campaigns in a chart): never red/amber/green, which mean priority or good/bad. */
  --cat1: #6a3fe8; --cat2: #0f7c8c; --cat3: #3b67d6; --cat4: #b0388a; --cat5: #6d7a12; --cat6: #7a5c3e; --cat7: #8a8a9e;
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --shadow: 0 10px 40px rgb(10 10 19 / 0.18);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a13; --surface: #12121d; --surface-2: #1a1a28; --line: #2a2a3a;
    --fg: #f1f1f6; --muted: #a8a8bc; --faint: #75758a;
    --violet: #9a82ff; --violet-soft: #1e1838;
    --hi: #ff6b6b; --hi-soft: #2c1518; --mid: #f2b155; --mid-soft: #2b2112; --lo: #a8a8bc; --lo-soft: #1f1f2e;
    --good: #4fd19a; --good-soft: #10261d;
    --c2: #5fb4e8; --c3: #f2b155;
    --cat1: #9a82ff; --cat2: #3fc1cf; --cat3: #6f97ff; --cat4: #e46cbf; --cat5: #b4c33a; --cat6: #c99a6c; --cat7: #8a8aa0;
    --shadow: 0 10px 40px rgb(0 0 0 / 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a13; --surface: #12121d; --surface-2: #1a1a28; --line: #2a2a3a;
  --fg: #f1f1f6; --muted: #a8a8bc; --faint: #75758a;
  --violet: #9a82ff; --violet-soft: #1e1838;
  --hi: #ff6b6b; --hi-soft: #2c1518; --mid: #f2b155; --mid-soft: #2b2112; --lo: #a8a8bc; --lo-soft: #1f1f2e;
  --good: #4fd19a; --good-soft: #10261d;
  --c2: #5fb4e8; --c3: #f2b155;
  --cat1: #9a82ff; --cat2: #3fc1cf; --cat3: #6f97ff; --cat4: #e46cbf; --cat5: #b4c33a; --cat6: #c99a6c; --cat7: #8a8aa0;
  --shadow: 0 10px 40px rgb(0 0 0 / 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-display); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { font-weight: 700; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg text { font-family: var(--font-mono); }

/* ---------- frame + sidebar ---------- */
.frame { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; }
.wordmark { display: inline-flex; align-items: center; gap: 7px; padding: 2px 8px; font-size: 21px; letter-spacing: -0.04em; line-height: 1; background: none; border: 0; justify-self: start; align-self: flex-start; }
.wordmark .ad { font-weight: 500; } .wordmark .mate { font-weight: 700; }
.pickbtn { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 8px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.pickbtn:hover { border-color: var(--faint); }
.pickbtn .label { grid-column: 1 / -1; font-size: 10px; }
.pickbtn b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickbtn small { grid-column: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickbtn .chev { grid-row: 2 / span 2; grid-column: 2; color: var(--muted); }
.viewbtn { border-color: var(--violet); }
.viewbtn b { color: var(--violet); }
.pickwrap { position: relative; }
.pop { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 260px; }
.pop button { background: none; border: 0; border-radius: 8px; padding: 8px 10px; text-align: left; display: grid; gap: 1px; }
.pop button:hover, .pop button[aria-checked="true"] { background: var(--surface); }
.pop button b { font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.pop button small { color: var(--muted); font-size: 12px; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.nav { display: grid; gap: 2px; }
.nav .grp { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
.nav button { display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: 8px; padding: 8px 10px; text-align: left; color: var(--muted); width: 100%; }
.nav button svg { flex: none; }
.nav button[aria-current="page"] { background: var(--violet-soft); color: var(--violet); font-weight: 500; }
.nav button:hover { color: var(--fg); }
.nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; background: var(--hi); color: #fff; border-radius: 999px; padding: 0 7px; }
.nav .count.soft { background: var(--surface-2); color: var(--muted); }
.side-foot { margin-top: auto; display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.side-foot button { background: none; border: 0; border-radius: 6px; padding: 5px 10px; text-align: left; color: var(--muted); font-size: 12.5px; }
.side-foot button:hover { background: var(--bg); color: var(--fg); }
.protopill { margin: 0 6px 4px; font-size: 11.5px; color: var(--muted); border: 1px dashed var(--faint); border-radius: 8px; padding: 6px 8px; }
.protopill b { color: var(--fg); font-weight: 500; }
.user { padding: 4px 10px 0; color: var(--muted); font-size: 12px; }

/* ---------- page header ---------- */
.main { min-width: 0; display: grid; align-content: start; }
.banner { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between; align-items: center; background: var(--violet-soft); border-bottom: 1px solid var(--line); padding-block: 7px; padding-inline: clamp(16px, 4vw, 40px); font-size: 13px; }
.banner b { font-weight: 500; }
.content { padding-block: 18px 56px; padding-inline: clamp(16px, 4vw, 40px); display: grid; gap: 20px; align-content: start; max-width: 1240px; width: 100%; }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.head h1 { font-size: 26px; }
.head .eyebrow { font-size: 13px; color: var(--muted); display: block; margin-bottom: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: relative; }
.ctx { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--muted); font-size: 13px; margin-top: -10px; }
.ctx b { color: var(--fg); font-weight: 500; }
.info { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--faint); color: var(--muted); font-size: 11px; font-weight: 700; cursor: help; background: none; padding: 0; line-height: 1; }
.periodbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; text-align: left; }
.periodbtn b { font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
.periodbtn span { color: var(--muted); font-size: 12px; }

/* ---------- period picker ---------- */
.picker { position: absolute; right: 0; top: calc(100% + 8px); z-index: 25; width: min(560px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 14px; max-height: min(80vh, 640px); overflow-y: auto; }
.pk { display: grid; gap: 8px; }
.pk h4 { margin: 0; font-size: 13px; font-weight: 500; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; max-height: 170px; overflow-y: auto; padding: 1px; }
.choices button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; font-family: var(--font-mono); font-size: 12px; text-align: left; }
.choices button small { display: block; color: var(--muted); font-family: var(--font-display); font-size: 11px; }
.choices button[aria-pressed="true"] { border-color: var(--violet); background: var(--violet-soft); color: var(--violet); font-weight: 500; }
.dates { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.radios { display: grid; gap: 6px; }
.radios label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.radios input { accent-color: var(--violet); margin-top: 3px; }
.radios small { display: block; color: var(--muted); font-size: 12px; }
.pickfoot { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.pickfoot span { margin-right: auto; color: var(--muted); font-size: 12px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; font-weight: 500; font-size: 13px; }
.btn.primary { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn:hover { border-color: var(--faint); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--violet); font-weight: 500; padding: 0; text-align: left; }
.link:hover { text-decoration: underline; }
.quick, .filters, .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button, .filters button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.quick button[aria-pressed="true"], .filters button[aria-pressed="true"] { border-color: var(--violet); background: var(--violet-soft); color: var(--violet); font-weight: 500; }
.tabs { gap: 0; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--muted); font-weight: 500; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--violet); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 2px; justify-self: start; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 4px 12px; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 500; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.toolbar .grow { flex: 1; }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.toggle input { accent-color: var(--violet); }
select.sel, input.inp { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 9px; font-size: 13px; }
input.inp:focus, select.sel:focus { outline: none; border-color: var(--violet); }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px; color: var(--muted); text-align: center; }
.empty b { color: var(--fg); font-weight: 500; display: block; margin-bottom: 4px; }

/* ---------- sections + cards ---------- */
.page { display: grid; gap: 28px; align-content: start; }
.section { display: grid; gap: 12px; align-content: start; }
.section > header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.section > header h2 { font-size: 18px; }
.section > header .hint { color: var(--muted); font-size: 13px; }
.section > header .more { margin-left: auto; }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.pad { padding: 14px 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

/* ---------- status + chips ---------- */
.statusbar { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { display: inline-flex; align-items: baseline; gap: 8px; border-radius: 10px; padding: 8px 14px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; text-align: left; }
button.stat:hover { border-color: var(--faint); }
.stat .num { font-size: 19px; font-weight: 500; }
.stat.hi { background: var(--hi-soft); border-color: transparent; color: var(--hi); }
.stat.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.oneline { color: var(--muted); max-width: 78ch; }
.prio { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 2px 7px; white-space: nowrap; font-weight: 500; }
.prio.high { background: var(--hi); color: #fff; }
.prio.medium { background: var(--mid-soft); color: var(--mid); box-shadow: inset 0 0 0 1px var(--mid); }
.prio.low, .prio.monitor { background: var(--lo-soft); color: var(--lo); }
.kindtag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px 1px 6px; white-space: nowrap; }
.plat { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; color: var(--muted); }
.start { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; background: var(--signal); color: var(--signal-ink); border-radius: 4px; padding: 2px 7px; font-weight: 500; }
.conf { display: inline-flex; gap: 3px; align-items: center; }
.conf i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.conf i.on { background: var(--fg); }
.conflabel { font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.delta { font-family: var(--font-mono); font-size: 12px; font-weight: 500; white-space: nowrap; }
.delta.good { color: var(--good); } .delta.bad { color: var(--hi); } .delta.flat { color: var(--muted); }
.impact { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.impact b { font-weight: 500; }
.impact.bad b { color: var(--hi); } .impact.good b { color: var(--good); }
.impact small { color: var(--muted); font-family: var(--font-display); font-size: 11.5px; }
/* Data vs interpretation vs suggestion: one small tag, used consistently. */
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; border-radius: 999px; padding: 1px 8px; white-space: nowrap; letter-spacing: 0; text-transform: none; font-family: var(--font-display); vertical-align: middle; }
.src::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: currentColor; }
.src.data { background: var(--surface-2); color: var(--muted); }
.src.read { background: var(--violet-soft); color: var(--violet); }
.src.step { background: var(--good-soft); color: var(--good); }
.src.ai { background: var(--mid-soft); color: var(--mid); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.high { background: var(--hi); } .sw.medium { background: var(--mid); } .sw.low { background: var(--lo); }
.tag { font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 10px; justify-self: start; white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); } .tag.warn { background: var(--mid-soft); color: var(--mid); } .tag.bad { background: var(--hi-soft); color: var(--hi); } .tag.flat { background: var(--surface-2); color: var(--muted); }
.path { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.path b { color: var(--fg); font-weight: 500; }
.lvl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
abbr.term { text-decoration: underline dotted var(--faint); text-underline-offset: 3px; cursor: help; }

/* ---------- charts ---------- */
.chartbox { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }
.chartbox svg { width: 100%; height: auto; display: block; }
.chartbox .title { font-weight: 500; font-size: 13.5px; }
.chartbox .cap { color: var(--muted); font-size: 12.5px; }
.drv { display: grid; gap: 6px; }
.drvrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px; }
.drvrow .bar { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.drvrow .bar i { display: block; height: 100%; border-radius: 3px; }
.drvrow .bar i.hurt { background: var(--hi); } .drvrow .bar i.help { background: var(--good); }
.drvrow .ch { text-align: right; }
.drvchip { font-family: var(--font-mono); font-size: 11.5px; border-radius: 6px; padding: 1px 7px; background: var(--surface-2); white-space: nowrap; }
.drvchip.hurt { color: var(--hi); } .drvchip.help { color: var(--good); }

/* ---------- KPI tiles + goals ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: var(--radius); padding: 12px; display: grid; gap: 4px; }
button.tile:hover { border-color: var(--faint); }
.tile[aria-pressed="true"] { border-color: var(--violet); box-shadow: inset 0 0 0 1px var(--violet); }
.tile .k { font-size: 12.5px; color: var(--muted); }
.tile .v { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tile .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile .t { font-size: 12px; color: var(--muted); }
.tile svg { width: 100px; height: 28px; flex: none; }
.goal { display: grid; gap: 6px; }
.goal .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.goal .name { font-weight: 500; }
.goal .val { font-family: var(--font-mono); margin-left: auto; }
.state { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.state.bad { background: var(--hi-soft); color: var(--hi); }
.state.warn { background: var(--mid-soft); color: var(--mid); }
.state.good { background: var(--good-soft); color: var(--good); }
.state.flat { background: var(--surface-2); color: var(--muted); }
.goal svg { width: 100%; height: 26px; display: block; overflow: visible; }
.goal .cap { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }

/* ---------- rows + lists ---------- */
.rows { display: grid; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.irow { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 12px 14px 12px 20px; border: 0; border-top: 1px solid var(--line); background: var(--bg); text-align: left; width: 100%; }
.irow:first-child { border-top: 0; }
.irow:hover { background: var(--surface); }
.irow::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--lo); }
.irow.high::before { background: var(--hi); } .irow.medium::before { background: var(--mid); }
.irow.closed { opacity: 0.7; }
.irow .body { min-width: 0; display: grid; gap: 4px; }
.irow .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.irow .t { font-weight: 500; }
.irow .sub { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 12.5px; }
.irow .rank { position: absolute; left: 0; }
.side-r { display: grid; justify-items: end; gap: 4px; }
.orow { grid-template-columns: 34px minmax(0, 1fr) auto; padding-left: 14px; }
.orow .n { font-family: var(--font-mono); font-size: 13px; color: var(--muted); text-align: center; }
.metric { font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: var(--surface-2); border-radius: 6px; padding: 1px 7px; }

/* Beginner */
.hero { border-radius: 16px; padding: 18px 20px; display: grid; gap: 12px; }
.hero.good { background: var(--good-soft); } .hero.warn { background: var(--mid-soft); } .hero.bad { background: var(--hi-soft); }
.hero h2 { font-size: 23px; }
.hero .say { font-size: 15px; max-width: 70ch; }
.plaingoals { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.plaingoals li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.plaingoals b { font-weight: 500; }
.ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.ico.good { background: var(--good); } .ico.warn { background: var(--mid); } .ico.bad { background: var(--hi); } .ico.flat { background: var(--faint); }
.tcard { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px 58px; display: grid; gap: 8px; background: var(--bg); }
.tcard .n { position: absolute; left: 16px; top: 16px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-family: var(--font-mono); color: #fff; background: var(--lo); }
.tcard.high .n { background: var(--hi); } .tcard.medium .n { background: var(--mid); }
.tcard .t { font-weight: 500; font-size: 15.5px; }
.tcard .why { color: var(--muted); }
.tcard ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.tcard .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
.tcard.closed { opacity: 0.65; }
.tcard.big { padding: 18px 18px 16px 60px; box-shadow: var(--shadow); border-color: transparent; }
.gcard { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; background: var(--bg); }
.gcard .t { font-weight: 500; overflow-wrap: anywhere; }
.gcard p { color: var(--muted); font-size: 13.5px; }
.gcard .do { color: var(--fg); }
.ccard { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; text-align: left; background: var(--bg); }
.ccard:hover { border-color: var(--faint); }
.ccard .t { font-weight: 500; overflow-wrap: anywhere; }
.ccard p { font-size: 13.5px; }
.words { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.words div { background: var(--surface); border-radius: 10px; padding: 9px 11px; font-size: 13px; }
.words b { font-weight: 500; display: block; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl th.sortable { cursor: pointer; }
.tbl th.sortable:hover { color: var(--fg); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: var(--surface); }
.tbl .r { text-align: right; }
.tbl .nm { font-weight: 500; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: baseline; }
.tbl .sub { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 3px; }
.tbl .was { color: var(--faint); font-size: 11px; }
.tbl select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-size: 12px; padding: 1px 4px; color: var(--muted); max-width: 150px; }
.tbl tr.lv1 td:nth-child(2) { padding-left: 32px; }
.tbl tr.lv2 td:nth-child(2) { padding-left: 54px; }
.tbl tr.lv1 td, .tbl tr.lv2 td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.tbl tr.grouphead td { background: var(--surface-2); font-weight: 500; font-size: 12.5px; padding-block: 6px; cursor: default; }
.tbl tr.sel td { background: var(--violet-soft); }
.tbl td.best { color: var(--good); font-weight: 500; } .tbl td.worst { color: var(--hi); font-weight: 500; }
.tbl.dense td { padding: 6px 9px; } .tbl.dense th { padding: 6px 9px; }
.tbl input[type="checkbox"] { accent-color: var(--violet); }
.tw { background: none; border: 0; padding: 0 4px 0 0; color: var(--muted); font-size: 12px; }

/* ---------- Explorer / Actions bulk ---------- */
.excontrols { display: grid; gap: 10px; }
.bulkbar { position: sticky; bottom: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 8px 12px; box-shadow: var(--shadow); }
.bulkbar .btn { background: var(--bg); color: var(--fg); border-color: transparent; }
.bulkbar span { margin-right: auto; font-size: 13px; }
.colpick { position: relative; }
.colpick .pop { left: auto; right: 0; width: 280px; max-height: 360px; overflow-y: auto; grid-template-columns: 1fr 1fr; }
.colpick label { display: flex; gap: 6px; align-items: center; font-size: 12.5px; padding: 4px 6px; }
.views { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.views button.v { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.views button.v[aria-pressed="true"] { border-color: var(--violet); color: var(--violet); }

/* ---------- Budget ---------- */
.pair { display: grid; gap: 3px; min-width: 160px; }
.pair div { display: grid; grid-template-columns: 56px minmax(0, 1fr) 40px; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
.pair .track { height: 8px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.pair i { display: block; height: 100%; border-radius: 2px; }
.pair i.sp { background: var(--faint); } .pair i.rs { background: var(--violet); }
.shift { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); gap: 12px; align-items: start; }
.shift .arrow { align-self: center; text-align: center; font-size: 22px; color: var(--muted); }

/* ---------- Alerts ---------- */
.ruleform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rule { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.rule:first-child { border-top: 0; }
.rule .grow { flex: 1; min-width: 200px; }
.fired { color: var(--hi); font-weight: 500; }

/* ---------- Audience ---------- */
.aud-controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.aud-basis { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12.5px; }
.insights { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.icard { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 6px; }
.icard.best { border-color: var(--good); } .icard.costly { border-color: var(--hi); }
.icard p { font-size: 13.5px; }
.icard .do { color: var(--muted); }
.vchip { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.vchip.best { background: var(--good-soft); color: var(--good); } .vchip.costly { background: var(--hi-soft); color: var(--hi); }
.vchip.average { background: var(--surface-2); color: var(--muted); } .vchip.small { border: 1px dashed var(--line); color: var(--muted); }
.segs { display: grid; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.segrow { display: grid; grid-template-columns: 170px minmax(0, 1fr) 120px 110px; gap: 12px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 13px; }
.segrow:first-child { border-top: 0; }
.segrow.head { background: var(--surface); }
.segbars { display: grid; gap: 3px; }
.segbars div { display: grid; grid-template-columns: 74px minmax(0, 1fr) 38px; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
.segbars i { display: block; height: 8px; border-radius: 2px; }
.segbars i.sp { background: var(--faint); } .segbars i.rs { background: var(--violet); }
.segbars .track { background: var(--surface-2); border-radius: 2px; }
.heat { display: grid; gap: 3px; }
.heat .hrowx { display: grid; gap: 3px; align-items: center; }
.heat .cell { border-radius: 3px; height: 30px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; }
.caution { border-left: 3px solid var(--mid); padding: 4px 0 4px 10px; color: var(--muted); font-size: 13px; }

/* ---------- forms + lists (settings, upload, reports) ---------- */
.list { display: grid; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.li { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .grow { flex: 1 1 260px; min-width: 0; display: grid; gap: 2px; }
.li .grow b { font-weight: 500; overflow-wrap: anywhere; }
.li .grow span { color: var(--muted); font-size: 12.5px; }
.formcard > header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline; }
.formcard > header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 65ch; }
.trow { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; padding: 16px; border-top: 1px solid var(--line); }
.trow:first-of-type { border-top: 0; }
.trow .who { display: grid; gap: 4px; align-content: start; }
.trow .who span { color: var(--muted); font-size: 12px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; align-content: start; }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; color: var(--muted); }
.field .in { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.field .in:focus-within { border-color: var(--violet); }
.field .in i { font-style: normal; font-family: var(--font-mono); font-size: 12px; color: var(--faint); padding-inline: 10px; }
.field input, .field select { width: 100%; min-width: 0; border: 0; background: transparent; padding: 8px 10px; outline: none; }
.field input { font-family: var(--font-mono); }
.note { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.be { grid-column: 1 / -1; background: var(--violet-soft); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; }
.be b { font-family: var(--font-mono); font-weight: 500; }
.formfoot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); }
.formfoot span { color: var(--muted); font-size: 12.5px; margin-right: auto; }
.uploadgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 28px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.drop b { font-weight: 500; }
.guides { display: grid; gap: 8px; align-content: start; }
.guides details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.guides summary { cursor: pointer; font-weight: 500; font-size: 13.5px; }
.guides ol { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
.small-note { color: var(--muted); font-size: 12.5px; }

/* ---------- drawer + modal ---------- */
.scrim { position: fixed; inset: 0; background: rgb(10 10 19 / 0.45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100%); background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 21; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.drawer > header { padding: 12px 20px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.drawer > header .x { justify-self: end; margin-top: -2px; background: none; border: 0; color: var(--muted); font-size: 13px; }
.drawer h3 { font-size: 19px; line-height: 1.25; }
.drawer .scroll { overflow-y: auto; padding: 16px 20px 28px; display: grid; gap: 20px; align-content: start; }
.drawer > footer { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: relative; }
.drawer > footer .note { margin-right: auto; grid-column: auto; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.crumbs b { color: var(--fg); font-weight: 500; }
.rank { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.rank > div { background: var(--surface); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 12.5px; }
.rank b { font-size: 13px; font-weight: 500; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rank span { color: var(--muted); }
.blk { display: grid; gap: 8px; }
.blk > h4 { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
.blk > h4 .stepno { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 500; }
.blk p { max-width: 72ch; }
.blk ol, .blk ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.bigchange { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.bigchange .v { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
.hyp { font-size: 12px; color: var(--muted); font-style: italic; }
.costbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.costbox .big { font-family: var(--font-mono); font-size: 20px; font-weight: 500; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.facts div { background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.facts b { font-family: var(--font-mono); font-size: 14px; color: var(--fg); font-weight: 500; }
.ev { width: 100%; border-collapse: collapse; font-size: 13px; }
.ev th, .ev td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.ev th:first-child, .ev td:first-child { text-align: left; }
.ev th { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.evwrap { overflow-x: auto; }
details.more > summary { cursor: pointer; color: var(--violet); font-weight: 500; font-size: 13.5px; }
details.more[open] > summary { margin-bottom: 12px; }
details.more > div { display: grid; gap: 14px; }
details.small > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.small ul { margin-top: 6px; color: var(--muted); font-size: 13px; }
.warnbox { background: var(--mid-soft); color: var(--mid); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.menu { position: absolute; bottom: calc(100% + 6px); right: 20px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 200px; z-index: 2; }
.menu button { background: none; border: 0; border-radius: 6px; padding: 7px 10px; text-align: left; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
.menu button:hover { background: var(--surface); }
.menu button small { color: var(--muted); font-family: var(--font-mono); }
.modal { position: fixed; inset: 0; display: grid; place-items: start center; padding: 24px 16px; z-index: 22; overflow-y: auto; }
.mbox { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: min(980px, 100%); display: grid; }
.mbox > header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); border-radius: 14px 14px 0 0; z-index: 2; }
.mbox h2 { font-size: 20px; }
.mbox .mbody { padding: 18px 20px 24px; display: grid; gap: 20px; }
.mbox ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 13.5px; }
.mbox .rtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mbox .rtiles .tile { padding: 10px; }
.mbox .rtiles .v { font-size: 19px; }
.mbox h3 { font-size: 15px; }

/* ---------- onboarding ---------- */
.onboard { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); width: min(900px, 100%); padding: 24px; display: grid; gap: 16px; }
.onboard h2 { font-size: 24px; }
.onboard > p { color: var(--muted); max-width: 66ch; }
.lvlcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.lvlcard { border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); padding: 16px; text-align: left; display: grid; gap: 8px; align-content: start; }
.lvlcard:hover, .lvlcard[aria-pressed="true"] { border-color: var(--violet); }
.lvlcard[aria-pressed="true"] { background: var(--violet-soft); }
.lvlcard b { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.lvlcard .job { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--violet); }
.lvlcard .who { font-size: 13.5px; }
.lvlcard ul { margin: 0; padding-left: 16px; display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.lvlcard .pick { justify-self: start; margin-top: 6px; pointer-events: none; }

/* ---------- Assistant ---------- */
.asst-fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 19; display: inline-flex; gap: 8px; align-items: center; background: var(--violet); color: #fff; border: 0; border-radius: 999px; padding: 11px 16px; font-weight: 500; box-shadow: var(--shadow); }
.asst { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 24; width: min(420px, calc(100vw - 24px)); height: min(640px, calc(100dvh - 40px)); background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.asst > header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.asst > header .who { display: grid; flex: 1; min-width: 0; }
.asst > header .who b { font-weight: 700; letter-spacing: -0.02em; }
.asst > header .who span { font-size: 12px; color: var(--muted); }
.asst > header button { background: none; border: 0; color: var(--muted); font-size: 13px; }
.asst .msgs { overflow-y: auto; padding: 14px; display: grid; gap: 10px; align-content: start; }
.bubble { border-radius: 12px; padding: 9px 12px; font-size: 13.5px; max-width: 92%; overflow-wrap: anywhere; }
.bubble p { margin: 0 0 6px; } .bubble p:last-child { margin: 0; }
.bubble ul, .bubble ol { margin: 4px 0 6px; padding-left: 18px; display: grid; gap: 3px; }
.bubble.me { background: var(--violet); color: #fff; justify-self: end; }
.bubble.ai { background: var(--surface); justify-self: start; }
.bubble.ai.err { background: var(--mid-soft); color: var(--mid); }
.bubble .think { color: var(--muted); font-style: italic; }
.asst .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.asst .chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; text-align: left; }
.asst .chips button:hover { border-color: var(--violet); color: var(--violet); }
.asst form { border-top: 1px solid var(--line); padding: 10px; display: grid; gap: 6px; }
.asst form .row { display: flex; gap: 6px; }
.asst textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); font-size: 13.5px; min-height: 40px; max-height: 120px; }
.asst textarea:focus { outline: none; border-color: var(--violet); }
.asst .fine { font-size: 11px; color: var(--muted); }
.ctxchip { font-size: 11.5px; color: var(--muted); background: var(--surface); border-radius: 6px; padding: 4px 8px; justify-self: start; }
.ctxchip b { color: var(--fg); font-weight: 500; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 8px; padding: 8px 14px; font-size: 13px; z-index: 40; max-width: calc(100% - 32px); }
.loading { padding: 40px 0; color: var(--muted); }

/* ---------- calendar (custom dates) ---------- */
.cal { display: grid; gap: 8px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.cal-nav button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; width: 30px; height: 28px; }
.cal-nav button:disabled { opacity: 0.35; cursor: not-allowed; }
.cal-ms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.cal-m > b { display: block; font-weight: 500; font-size: 13px; margin-bottom: 4px; text-align: center; }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px 0; }
.cal-g > span { font-size: 10.5px; color: var(--muted); text-align: center; font-family: var(--font-mono); padding-bottom: 2px; }
.cd { border: 0; background: none; height: 30px; font-family: var(--font-mono); font-size: 12px; border-radius: 6px; }
.cd:hover:not(:disabled) { background: var(--surface-2); }
.cd.in { background: var(--violet-soft); color: var(--violet); border-radius: 0; }
.cd.edge { background: var(--violet); color: #fff; border-radius: 6px; }
.cd.today { box-shadow: inset 0 0 0 1px var(--faint); }
.cd:disabled { color: var(--faint); opacity: 0.45; cursor: not-allowed; }
.cal-sum { font-size: 12.5px; }
.cal-sum b { font-family: var(--font-mono); font-weight: 500; }

/* ---------- Budget ---------- */
.bstack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.bstack button { border: 0; padding: 0; height: 100%; min-width: 4px; opacity: 0.45; }
.bstack button[aria-pressed="true"], .bstack button:hover { opacity: 1; }
.bcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.bcard { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 3px; }
.bcard:hover { border-color: var(--faint); }
.bcard[aria-pressed="true"] { border-color: var(--violet); box-shadow: inset 0 0 0 1px var(--violet); background: color-mix(in srgb, var(--violet-soft) 45%, var(--bg)); }
.bcard .top { display: flex; align-items: center; gap: 7px; }
.bcard .top b { font-weight: 500; }
.bcard .amt { font-family: var(--font-mono); font-size: 18px; font-weight: 500; }
.brows { display: grid; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.brow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) minmax(130px, auto); gap: 6px 16px; align-items: center; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); text-align: left; background: var(--bg); width: 100%; }
.brow:first-child { border-top: 0; }
.brow:hover { background: var(--surface); }
.brow .nm { font-weight: 500; overflow-wrap: anywhere; display: flex; gap: 7px; align-items: center; }
.brow > span { min-width: 0; display: block; }
.brow .bar { display: block; height: 12px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.brow .bar i { display: block; height: 100%; border-radius: 4px; }
.brow .meta2 { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.brow .call { justify-self: end; text-align: right; display: grid; gap: 3px; justify-items: end; }
.todo3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.todo3 > div { border-radius: 12px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.todo3 .g { background: var(--good-soft); } .todo3 .w { background: var(--mid-soft); } .todo3 .b { background: var(--surface); }
.todo3 ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; }

/* ---------- Alerts ---------- */
.switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background 0.15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left 0.15s; }
.switch input:checked { background: var(--violet); }
.switch input:checked::after { left: 19px; }
.optrow { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.optrow > span:first-child { min-width: 170px; color: var(--muted); font-size: 13px; }
.optrow label { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; }
.optrow input[type="checkbox"], .optrow input[type="radio"] { accent-color: var(--violet); }
.days { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.days label { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; cursor: pointer; }
.days label:has(input:checked) { border-color: var(--violet); background: var(--violet-soft); color: var(--violet); }
.days input { position: absolute; opacity: 0; pointer-events: none; }
.basis { font-size: 11.5px; font-weight: 500; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.basis.past { background: var(--surface-2); color: var(--fg); } .basis.target { background: var(--violet-soft); color: var(--violet); }
.tg { background: #e7eef5; border-radius: 14px; padding: 16px; display: grid; gap: 8px; max-width: 460px; }
:root[data-theme="dark"] .tg { background: #1a2633; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tg { background: #1a2633; } }
.tg .who { font-size: 12px; color: var(--muted); }
.tg .msg { background: var(--bg); border-radius: 12px 12px 12px 4px; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
.tg .time { font-size: 11px; color: var(--muted); text-align: right; }

/* ---------- responsive ---------- */
@media (max-width: 1060px) {
  .two, .uploadgrid { grid-template-columns: minmax(0, 1fr); }
  .lvlcards { grid-template-columns: minmax(0, 1fr); }
  .mbox .rtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .segrow { grid-template-columns: 130px minmax(0, 1fr) 96px; }
  .segrow > :last-child { display: none; }
  .trow { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 14px; gap: 8px; position: static; height: auto; overflow: visible; display: grid; grid-template-columns: auto 1fr 1fr; align-items: center; }
  .side .wordmark { grid-column: 1; }
  .side .pickwrap { min-width: 0; }
  .side .pickbtn small, .side .pickbtn .label { display: none; }
  .side .pickbtn { padding: 6px 10px; }
  .side .pickbtn .chev { grid-row: 1; }
  .side .pop { position: fixed; left: 12px; right: 12px; top: 64px; }
  .nav { grid-column: 1 / -1; display: flex; gap: 4px; overflow-x: auto; }
  .nav .grp { display: none; }
  .nav button { white-space: nowrap; width: auto; }
  .side-foot { display: none; }
  .head h1 { font-size: 22px; }
  .irow { grid-template-columns: minmax(0, 1fr); }
  .orow { grid-template-columns: 26px minmax(0, 1fr); }
  .orow .side-r { grid-column: 2; }
  .irow .side-r { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px 12px; align-items: center; }
  .drvrow { grid-template-columns: 110px minmax(0, 1fr) 56px; }
  .segrow { grid-template-columns: minmax(0, 1fr) 90px; }
  .segrow .segbars { grid-column: 1 / -1; grid-row: 2; }
  .shift { grid-template-columns: minmax(0, 1fr); }
  .cal-ms { grid-template-columns: minmax(0, 1fr); }
  .cal-ms .cal-m:first-child { display: none; }
  .brow { grid-template-columns: minmax(0, 1fr); }
  .brow .call { justify-self: start; justify-items: start; text-align: left; }
  .todo3 { grid-template-columns: minmax(0, 1fr); }
  .shift .arrow { transform: rotate(90deg); }
  .asst { right: 12px; bottom: 12px; }
  .tcard { padding-left: 52px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 0.18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0.6; } }
}

  return s + "</svg>";
}
// "Why it changed": each driver's share of the change in the main result.
function driverBars(drivers) {
  if (!drivers?.length) return "";
  return `<div class="drv">${[...drivers].sort((x, y) => y.weight - x.weight).map((d) => `<div class="drvrow"><span>${T(drvName(d.key, d.label))}</span><span class="bar" title="${Math.round(d.weight * 100)}% of the movement"><i class="${d.helped ? "help" : "hurt"}" style="width:${Math.max(3, d.weight * 100)}%"></i></span><span class="ch num ${d.helped ? "delta good" : "delta bad"}">${d.change > 0 ? "▲" : "▼"} ${signed(d.change)}</span></div>`).join("")}
    <div class="legend"><span><i class="sw" style="background:var(--hi)"></i>pushed the result the wrong way</span><span><i class="sw" style="background:var(--good)"></i>helped</span><span>Bar length = share of the change it explains</span></div></div>`;
}
const driverChip = (drivers) => { const m = mainDriver(drivers); return m && Math.abs(m.change) >= 0.03 ? `<span class="drvchip ${m.helped ? "help" : "hurt"}" title="Main driver of the change">${esc(drvName(m.key, m.label).replace(/ \(.*\)$/, ""))} ${signed(m.change)}</span>` : ""; };
function driverSentence(drivers, mode) {
  const m = mainDriver(drivers);
  if (!m || Math.abs(m.change) < 0.03) return "";
  return `Mainly because ${drvPlain(m)} (${esc(drvName(m.key, m.label))} ${signed(m.change)}), which explains about ${Math.round(m.weight * 100)}% of the change.`;
}

function openDrawer(d, opts = {}) {

const recheckOf = (d) => (d.whatToDo ?? []).find((s) => /^Re-check/.test(s));
const stepsOf = (d) => (d.whatToDo ?? []).filter((s) => !/^Re-check/.test(s));
const prReasonOf = (d) => String(d.priorityReason ?? "").replace(/^(High|Medium|Low)( instead of high)?: /, "");

function drawerBeginner(d, r, series, v) {
  const camp = String(d.where ?? "").split(" › ")[0];
  const tone = d.bucket === "problem" ? (d.priority === "high" ? "bad" : "warn") : d.bucket === "opportunity" ? "good" : "flat";
  const i = d.impact;
  const money1 = i && i.known && i.amount > 0 ? (i.label === "saved" ? `This saved you about <b>${money(i.amount)}</b> compared with what AdMate expected.` : i.label === "extra revenue" ? `This brought about <b>${money(i.amount)}</b> more in sales than expected.` : `This cost you about <b>${money(i.amount)}</b> ${i.label === "lost revenue" ? "in lost sales" : "extra"} in ${esc(v.label)}.`) : "";
  const steps = stepsOf(d);
  const rc = recheckOf(d);
  const ev = (d.evidence ?? []).slice(0, 4);
  const head = `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="tag ${tone}">${esc(PRIO_PLAIN[d.priority] ?? "")}</span>${plat(d.platform)}</div>
    <h3 id="dr-t">${esc(plain(d.title))}</h3>${camp ? `<div class="crumbs">In <b>${esc(camp)}</b></div>` : ""}`;
  const main = `
    <div class="blk"><h4>What’s happening</h4><p>${esc(plain(d.description))}</p></div>
    ${money1 ? `<div class="blk"><h4>Why it matters</h4><p>${money1}</p></div>` : ""}
    ${steps.length ? `<div class="blk"><h4>What to do</h4><ol>${steps.map((s) => `<li>${esc(plain(s))}</li>`).join("")}</ol>${rc ? `<p class="small-note">${esc(plain(rc))}</p>` : ""}</div>` : ""}
    ${series ? `<div class="blk"><h4>How it’s going, day by day</h4>${simpleBars(series, v.from, v.to)}</div>` : ""}
    <details class="more"><summary>More detail, still in plain words</summary><div>
      ${ev.length ? `<div class="blk"><h4>The numbers behind this</h4><ul>${ev.map((e) => `<li>${esc(plain(e.label))}: ${e.a ? `${esc(e.a)} before → ` : ""}<b>${esc(e.b)}</b>${e.a ? " now" : ""}</li>`).join("")}</ul></div>` : ""}
      ${d.whyHappening?.[0] ? `<div class="blk"><h4>Likely reason</h4><span class="hyp">A best guess from the numbers, not a confirmed cause.</span><p>${esc(plain(d.whyHappening[0]))}</p></div>` : ""}
      <div class="blk"><h4>How sure is AdMate?</h4><p>${esc(CONF_PLAIN[d.confidence] ?? "")}</p></div>
      <p><button class="link" type="button" data-deeper="${esc(d.key)}">See the full analysis (Intermediate view) →</button></p>
    </div></details>`;
  return { head, main };
}

function drawerInvestigate(d, r, series, v, adv) {
  const steps = stepsOf(d);
  const rc = recheckOf(d);
  const cause = d.whyHappening?.[0], rest = (d.whyHappening ?? []).slice(1);
  const prReason = prReasonOf(d);
  const kind = kindOf(d);
  const head = `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${prioChip(d.priority)}${kindTag(kind)}${plat(d.platform)}${impactChip(d)}</div>
    <h3 id="dr-t">${esc(d.title)}</h3>${d.where ? `<div class="crumbs">${pathHtml(d.where)}</div>` : ""}`;
  // 1. What changed
  const big = r && r.kpi != null
    ? `<div class="bigchange"><span class="v">${kpi(r.kpi, r.mode)}</span><span class="muted">${T(r.kpiShort)} in ${esc(v.label)}</span>${r.kpiA != null ? `<span class="muted">was ${kpi(r.kpiA, r.mode)}${v.compareLabel ? ` in ${esc(v.compareLabel)}` : ""}</span>${deltaChip(r.change, r.mode, r.confidence)}` : `<span class="small-note">${v.compareLabel ? "No data in the comparison period." : "No comparison period selected."}</span>`}</div>`
    : "";
  const evTable = (d.evidence ?? []).length ? `<div class="evwrap"><table class="ev"><thead><tr><th>Metric</th><th>${v.compareLabel ? esc(v.compareLabel) : "Before"}</th><th>${esc(v.label)}</th></tr></thead><tbody>${d.evidence.map((e) => `<tr><td>${T(e.label)}</td><td class="num">${esc(e.a ?? "—")}</td><td class="num">${esc(e.b)}</td></tr>`).join("")}</tbody></table></div>` : "";
  // 2. Why
  const drv = r?.drivers;
  const whyBlock = drv?.length || cause
    ? `<div class="blk"><h4><span class="stepno">2</span> Why ${src("read")}</h4>${drv?.length ? `${driverBars(drv)}<p>${driverSentence(drv, r.mode)}</p>` : ""}${cause ? `<p><span class="hyp">Likely cause (a hypothesis):</span> ${esc(cause)}</p>` : ""}${rest.length ? `<details class="small"><summary>More context (${rest.length})</summary><ul>${rest.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></details>` : ""}</div>`
    : "";
  // 3. Where: the ad sets / ads behind it, or the ad's siblings in its ad set.
  const where = r ? whereTable(r, v) : "";
  const stats = adv && r ? advStats(r, d, v) : "";
  const main = `
    <div class="rank">
      <div><b>Priority ${prioChip(d.priority)}</b><span>How much it matters now. ${esc(prReason)}</span></div>
      <div><b>Confidence ${confDots(d.confidence)} ${esc(d.confidence)}</b><span>How sure AdMate is. ${esc(String(d.confidenceText ?? "").replace(/^\w+ — /, ""))}</span></div>
    </div>
    <div class="blk"><h4><span class="stepno">1</span> What changed ${src("data")}</h4>${big}<p>${esc(d.description)}</p>${evTable}</div>
    ${whyBlock}
    ${where ? `<div class="blk"><h4><span class="stepno">3</span> Where ${src("data")}</h4>${where}</div>` : ""}
    ${series ? `<div class="blk"><h4><span class="stepno">${where ? 4 : 3}</span> Day by day ${src("data")}</h4>${dailyChart(series, v.from, v.to)}${dailyFacts(series, v.from, v.to)}</div>` : ""}
    ${d.cost ? `<div class="blk"><h4>What it cost ${src("data")}</h4><div class="costbox"><p>${esc(d.cost)}</p><span class="small-note">Looking back only: money the change already cost, not a forecast.</span></div></div>` : ""}
    <div class="blk"><h4>What to do ${src("step")}</h4><ol>${steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>${d.risk ? `<p class="small-note"><b>Risk:</b> ${esc(d.risk)}</p>` : ""}${rc ? `<p class="small-note">${esc(rc)}</p>` : ""}</div>
    ${(d.cantTell ?? []).length ? `<div class="warnbox"><b>What this report can’t tell us.</b> ${d.cantTell.map(esc).join(" ")}</div>` : ""}
    ${stats}
    <details class="small" ${adv ? "open" : ""}><summary>How AdMate judged this</summary><ul>${(d.judgedBy ?? []).map((w) => `<li>${esc(w)}</li>`).join("")}</ul></details>`;
  return { head, main };
}
function whereTable(r, v) {
  let rows = [], title = "", vsSiblings = false;
  if (r.level === "campaign") { rows = v.levels.ad_group.filter((x) => x.campaignId === r.id); title = "Its ad sets"; }
  else if (r.level === "ad_group") { rows = v.levels.ad.filter((x) => x.adSetId === r.id); title = "Its ads"; vsSiblings = true; }
  else { rows = v.levels.ad.filter((x) => x.adSetId === r.adSetId); title = "This ad and the other ads in its ad set"; vsSiblings = true; }
  if (rows.length < 2 && r.level !== "campaign") return "";
  if (!rows.length) return "";
  const vals = rows.map((x) => x.kpi).filter((k) => k != null);
  const bestK = vals.length ? (higher(r.mode) ? Math.max(...vals) : Math.min(...vals)) : null;
  const worstK = vals.length ? (higher(r.mode) ? Math.min(...vals) : Math.max(...vals)) : null;
  const ads = r.level === "campaign" ? v.levels.ad.filter((x) => x.campaignId === r.id).sort((a, b) => b.spend - a.spend).slice(0, 6) : [];
  const tbl = (list, label) => `<div class="tablewrap"><table class="tbl dense"><thead><tr><th>${label}</th><th class="r">Spend</th><th class="r">${T(r.kpiShort)}</th><th class="r">Change</th><th class="r">${T("CTR")}</th><th>Next step</th></tr></thead><tbody>${list.map((x) => `<tr class="click${x.id === r.id ? " sel" : ""}" data-entity="${x.level}:${esc(x.id)}"><td><div class="nm">${esc(x.name)}</div></td><td class="r num">${money(x.spend)}</td><td class="r num ${x.kpi != null && x.kpi === bestK && list.length > 1 ? "best" : x.kpi != null && x.kpi === worstK && list.length > 1 ? "worst" : ""}">${kpi(x.kpi, x.mode)}</td><td class="r">${deltaChip(x.change, x.mode, x.confidence)}</td><td class="r num">${pct(x.ctr, 2)}</td><td>${esc(x.label ?? "")}</td></tr>`).join("")}</tbody></table></div>`;
  return `<p class="small-note">${esc(title)}${vsSiblings ? ": ads in the same ad set share its audience and budget, so they’re a fair comparison." : "."} Green = best, red = weakest. Click a row to open it.</p>${tbl(rows, LEVEL[rows[0].level])}${ads.length ? `<p class="small-note">Its biggest ads:</p>${tbl(ads, "Ad")}` : ""}`;
}
function advStats(r, d, v) {
  const cells = [["Spend", money(r.spend)], ["Share of spend", pct(r.share, 1)], ["Impressions", n0(r.impressions)], ["Reach", n0(r.reach)], ["Frequency", n1(r.frequency)], ["Clicks", n0(r.clicks)], ["CTR", pct(r.ctr, 2)], ["CPC", money(r.cpc)], ["CPM", money(r.cpm)], [r.resultLabel, n0(r.results)], ["Conversion rate", pct(r.cvr, 1)], [r.kpiShort, kpi(r.kpi, r.mode)]];
  return `<div class="blk"><h4>Statistics ${src("data")}</h4>
    <div class="facts">${cells.map(([k, val]) => `<div>${esc(k)}<b>${val}</b></div>`).join("")}</div>
    <p class="small-note"><b>Compared with:</b> ${esc(r.yardstick ?? "nothing yet")}${v.history ? ` · older history checked: ${esc(v.history)}` : ""}${v.perDay ? " · volumes per day (periods of different length)" : ""}.</p></div>`;
}

function footer(dec, mode = "", depth = L()) {
  if (dec) return `<span class="note small-note">${esc(STATUS_TEXT(dec))}.</span><button class="btn" type="button" data-act="restore">${dec.status === "remind" ? "Cancel reminder" : "Undo"}</button>`;
  if (depth === "beginner") return `<span class="note small-note">AdMate never changes your ads. You make the change, then tell AdMate.</span><button class="btn" type="button" data-act="remind" data-days="1">Remind me tomorrow</button><button class="btn" type="button" data-act="dismissed" data-reason="Not relevant">Not for me</button><button class="btn primary" type="button" data-act="done">I did this</button>`;
  if (mode === "dismiss") return `<span class="note small-note">Why? It helps AdMate get better.</span>${["Not relevant", "Already handled", "Wrong"].map((r) => `<button class="btn small" type="button" data-act="dismissed" data-reason="${r}">${r}</button>`).join("")}<button class="btn small" type="button" data-act="cancel">Cancel</button>`;
  const menu = mode === "remind" ? `<div class="menu" role="menu">${[[1, "Tomorrow"], [3, "In 3 days"], [7, "In a week"]].map(([n, l]) => `<button type="button" role="menuitem" data-act="remind" data-days="${n}">${l}<small>${fmtDay(addDays(END, n))}</small></button>`).join("")}</div>` : "";
  return `${menu}<span class="note small-note">AdMate never changes your ad account.</span>
    <button class="btn" type="button" data-act="remindmenu" aria-expanded="${mode === "remind"}">Remind me later ▾</button><button class="btn" type="button" data-act="dismiss">Dismiss</button><button class="btn primary" type="button" data-act="done">Action taken</button>`;
}
function decideKey(key, kind, extra, quiet) {
  if (kind === "restore") { delete decided[key]; if (!quiet) toast("Back on the list"); return; }
  if (kind === "remind") {
    const until = addDays(END, Number(extra ?? 1));
    decided[key] = { status: "remind", until };
    if (!quiet) toast(`We’ll remind you on ${fmtDay(until)}`);
  } else {
    decided[key] = { status: kind, reason: extra };
    if (!quiet) toast(kind === "done" ? "Noted. AdMate checks whether it worked after your next upload." : "Dismissed");
  }
}
function act(kind, extra) {
  const d = current;
  if (!d) return;
  if (kind === "dismiss") return ($("#drawerFoot").innerHTML = footer(null, "dismiss"));
  if (kind === "remindmenu") return ($("#drawerFoot").innerHTML = footer(null, $(".menu") ? "" : "remind"));
  if (kind === "cancel") return ($("#drawerFoot").innerHTML = footer(null));
  decideKey(d.key, kind, extra);
  closeOverlay();
  render();
}

// A preset (Last 7 days, a week, a month) keeps its tab; anything else opens the calendar.
function guessKind(p) {
  for (const k of ["day", "week", "month"]) if (choices(k).some((c) => c.from === p.from && c.to === p.to)) return k;
  return "custom";
}
function chooser(which) {
  const kind = which === "a" ? pk.aKind : pk.bKind, cur = pk[which];
  const list = kind === "custom" ? [] : choices(kind);
  const tabs = ["day", "week", "month", "custom"].map((k) => `<button type="button" data-pkkind="${which}:${k}" aria-pressed="${k === kind}">${{ day: "Day", week: "Week", month: "Month", custom: "Calendar" }[k]}</button>`).join("");
  const body = kind === "custom"
    ? calendarHtml(which)
    : `<div class="choices">${list.map((c, i) => `<button type="button" data-pkpick="${which}:${i}" aria-pressed="${cur && cur.from === c.from && cur.to === c.to}">${esc(c.name)}${c.small ? `<small>${esc(c.small)}</small>` : ""}</button>`).join("")}</div>`;
  return `<div class="seg" role="group" aria-label="Period type">${tabs}</div>${body}`;
}
// Calendar: two months side by side; click the first day, then the last day.
const monthOf = (d) => d.slice(0, 7);
const shiftMonth = (ym, n) => { const [y, m] = ym.split("-").map(Number); return iso(new Date(Date.UTC(y, m - 1 + n, 1))).slice(0, 7); };
function calendarHtml(which) {
  const cur = pk[which];
  const c = (pk.cal[which] ??= { month: monthOf(cur?.to && cur.to <= END ? cur.to : END), anchor: null });
  const min = MIN(), max = END;
  const shown = c.anchor ? { from: c.anchor, to: c.anchor } : cur;
  const month = (ym) => {
    const [y, m] = ym.split("-").map(Number);
    const first = new Date(Date.UTC(y, m - 1, 1));
    const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = "";
    for (let i = 0; i < (first.getUTCDay() + 6) % 7; i++) cells += "<span></span>";
    for (let dd = 1; dd <= n; dd++) {
      const ds = `${ym}-${String(dd).padStart(2, "0")}`;
      const inR = shown && ds >= shown.from && ds <= shown.to;
      const edge = shown && (ds === shown.from || ds === shown.to);
      cells += `<button type="button" class="cd${inR ? " in" : ""}${edge ? " edge" : ""}${ds === max ? " today" : ""}" data-calday="${which}:${ds}" aria-label="${fmtDay(ds)}${ds === max ? " (latest data)" : ""}" aria-pressed="${!!edge}" ${ds < min || ds > max ? "disabled" : ""}>${dd}</button>`;
    }
    return `<div class="cal-m"><b>${first.toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" })}</b><div class="cal-g">${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((x) => `<span>${x}</span>`).join("")}${cells}</div></div>`;
  };
  const left = shiftMonth(c.month, -1);
  return `<div class="cal">
    <div class="cal-nav"><button type="button" data-calnav="${which}:-1" aria-label="Earlier months" ${left <= monthOf(min) ? "disabled" : ""}>‹</button><span>${c.anchor ? "Now click the last day" : "Click the first day, then the last day"}</span><button type="button" data-calnav="${which}:1" aria-label="Later months" ${c.month >= monthOf(max) ? "disabled" : ""}>›</button></div>
    <div class="cal-ms">${month(left)}${month(c.month)}</div>
    <p class="cal-sum">${cur && !c.anchor ? `Selected: <b>${range(cur.from, cur.to)}</b> · ${plural(days(cur.from, cur.to), "day")}` : c.anchor ? `Starts <b>${fmtDay(c.anchor)}</b>…` : "Nothing selected yet."} <span class="small-note">Data from ${fmtDate(min)} to ${fmtDate(max)}.</span></p>
  </div>`;
}
function calClick(which, ds) {
  const c = pk.cal[which];
  if (!c.anchor) { c.anchor = ds; pk[which] = { from: ds, to: ds, name: fmtDay(ds) }; }
  else {
    const from = ds < c.anchor ? ds : c.anchor, to = ds < c.anchor ? c.anchor : ds;
    pk[which] = { from, to, name: range(from, to) };
    c.anchor = null;
  }
  drawPicker();
}
function drawPicker() {
  const prev = prevOf(pk.a);
  $("#pickerRoot").innerHTML = `<div class="picker" role="dialog" aria-label="Choose periods">
    <div class="pk"><h4>1. Show</h4>${chooser("a")}</div>
    <div class="pk"><h4>2. Compare with</h4>
      <div class="radios">
        <label><input type="radio" name="pkcmp" value="previous" ${pk.cmp === "previous" ? "checked" : ""}><span>The period right before<small>${range(prev.from, prev.to)}${prev.from < MIN() ? " · partly before your first upload" : ""}</small></span></label>
        <label><input type="radio" name="pkcmp" value="pick" ${pk.cmp === "pick" ? "checked" : ""}><span>Another period I choose<small>e.g. this Tuesday vs last Tuesday, or October vs August</small></span></label>
        <label><input type="radio" name="pkcmp" value="none" ${pk.cmp === "none" ? "checked" : ""}><span>Don’t compare<small>Judged against each campaign’s own past and your targets</small></span></label>
      </div>
      ${pk.cmp === "pick" ? chooser("b") : ""}
    </div>
    <div class="pickfoot"><span>Data from ${fmtDate(MIN())} to ${fmtDate(END)}</span><button class="btn" type="button" data-pkcancel>Cancel</button><button class="btn primary" type="button" data-pkapply>Apply</button></div>
  </div>`;
}
function readCustom(which) {
  const f = $(`#pk-${which}-from`)?.value, t = $(`#pk-${which}-to`)?.value;
  if (f && t && f <= t) pk[which] = { from: f, to: t, name: range(f, t) };
}
function closePicker() { if ($("#pickerRoot")) $("#pickerRoot").innerHTML = ""; $("#periodBtn")?.setAttribute("aria-expanded", "false"); pk = null; }

// ===== ui/20-beginner.js =====
// Beginner · Understand. One screen answers three questions: Are my ads OK? What's the
// biggest problem? What should I do next? Plain words, one simple chart, no filters
// or settings to learn. Going deeper stays plain; the full analysis is one link away.

const TONE = { far_off: "bad", worse: "bad", off_track: "warn", on_track: "good", better: "good", flat: "flat", unknown: "flat" };
const ICONCH = { good: "✓", warn: "!", bad: "✕", flat: "•" };
const periodWord = (v) => (v.days === 7 ? "week" : v.days === 1 ? "day" : `${v.days} days`);
// "the week before", or the period the user picked to compare with.
const beforeWords = (v) => (sel.cmp === "pick" && v.compareLabel ? v.compareLabel : `the ${periodWord(v)} before`);
// "in the last 7 days", "in October", "in Sep 20 – Oct 4".
const periodWords = (v) => {
  const n = sel.a.name;
  if (!n || n === range(sel.a.from, sel.a.to)) return `in ${v.label}`;
  if (/^(Last|This|The)\b/.test(n)) return `in ${n.replace(/^Last/, "the last").replace(/^This/, "this").replace(/^The/, "the")}`;
  return /^Whole/.test(n) ? `in ${n.toLowerCase().replace(/^whole/, "the whole")}` : `in ${n}`;
};

function plainValue(o, val) {
  if (o.mode === "roas") return `you got <b>$${val.toFixed(2)} back in sales for every $1</b> you spent`;
  if (o.mode === "cpm") return `showing your ads 1,000 times cost <b>${money(val)}</b>`;
  return `each ${esc(singular(o))} cost you <b>${money(val)}</b>`;
}
function plainGoal(o, v) {
  const g = goalOf(o);
  if (o.value == null) return { tone: "flat", text: `<b>${esc(o.label)}:</b> not enough results yet to judge.` };
  const k = (x) => (x == null ? "—" : o.mode === "roas" ? `$${x.toFixed(2)} back` : money(x));
  const before = beforeWords(v);
  const judge = {
    far_off: g.breakEven != null && (higher(o.mode) ? o.value < g.breakEven : o.value > g.breakEven) ? `Your goal is ${g.target != null ? k(g.target) : "better"}, so <b>you’re losing money</b> on these ads.` : `That’s far from your goal of ${k(g.target)}.`,
    off_track: `That’s a little worse than your goal of ${k(g.target)}.`,
    on_track: `Your goal is ${k(g.target)}, so <b>you’re on track</b>.`,
    better: `That’s better than ${before} (${k(o.previous)}).`,
    worse: `That’s worse than ${before} (${k(o.previous)}).`,
    flat: `About the same as ${before}.`,
    unknown: "",
  }[g.state] ?? "";
  return { tone: TONE[g.state] ?? "flat", text: `<b>${esc(o.label)}:</b> ${plainValue(o, o.value)}. ${judge}` };
}
function begStatus(v) {
  const main = byGoalSpend(v).slice(0, 3);
  const lines = main.map((o) => plainGoal(o, v));
  const probs = openProblems(v).filter((d) => d.priority === "high" || d.priority === "medium");
  const bad = lines.some((l) => l.tone === "bad") || probs.some((d) => d.priority === "high");
  const warn = bad || lines.some((l) => l.tone === "warn") || probs.length > 0;
  const tone = bad ? "bad" : warn ? "warn" : "good";
  const headline = tone === "bad" ? `Your ads need attention${probs.length ? `: ${plural(probs.length, "problem")} to fix` : ""}` : tone === "warn" ? "Mostly OK, with a few things to improve" : "Your ads are doing well";
  return { tone, headline, lines };
}
function moneyLine(d, v) {
  const i = d.impact;
  if (!i || !i.known || !(i.amount > 0)) return "";
  if (i.label === "saved") return ` It saved you about <b>${money(i.amount)}</b> compared with what AdMate expected.`;
  if (i.label === "extra revenue") return ` It brought about <b>${money(i.amount)}</b> more in sales than expected.`;
  return ` This cost you about <b>${money(i.amount)}</b> ${i.label === "lost revenue" ? "in lost sales" : "extra"}.`;
}
// One thing to do, with its steps and the buttons to tick it off.
function tcard(d, i, opts = {}) {
  const v = V();
  const dec = decided[d.key];
  const steps = stepsOf(d).slice(0, 3);
  const camp = String(d.where ?? "").split(" › ")[0];
  return `<div class="tcard ${d.priority}${dec ? " closed" : ""}${opts.big ? " big" : ""}"><span class="n" aria-hidden="true">${i + 1}</span>
    <span class="label" style="font-size:10.5px">${esc(PRIO_PLAIN[d.priority] ?? "")}${camp ? ` · ${esc(camp)}` : ""}</span>
    <span class="t">${esc(plain(d.title))}</span>
    <p class="why">${esc(plain(firstSentence(d.description)))}${moneyLine(d, v)}</p>
    ${steps.length ? `<div><span class="label" style="font-size:10.5px">How to do it</span><ol>${steps.map((s) => `<li>${esc(plain(s))}</li>`).join("")}</ol></div>` : ""}
    <div class="acts">${dec ? `<span class="small-note">${esc(STATUS_TEXT(dec))}</span><button class="btn small" type="button" data-undo="${esc(d.key)}">Undo</button>` : `<button class="btn primary small" type="button" data-decide="${esc(d.key)}" data-kind="done">I did this</button><button class="btn small" type="button" data-decide="${esc(d.key)}" data-kind="remind" data-days="1">Remind me tomorrow</button>`}
      <button class="link" type="button" data-key="${esc(d.key)}">Explain more</button>
      <button class="link" type="button" data-askabout="${esc(d.key)}">Ask the Assistant</button></div>
  </div>`;
}

function begHome() {
  const v = V();
  if (!v.objectives.length) return emptyState("No ad spend in this period", "Pick another period above, or upload a newer report.");
  const st = begStatus(v);
  const ch = v.spendChange;
  const spend = `You spent <b>${money(v.spend)}</b> ${esc(periodWords(v))}${ch == null || !v.compareLabel ? "" : Math.abs(ch) < 0.03 ? `, about the same as ${esc(beforeWords(v))}` : `, ${pct(Math.abs(ch))} ${ch > 0 ? "more" : "less"} than ${esc(beforeWords(v))}`}.`;
  const todo = decisions(v);
  const probs = todo.filter((d) => d.bucket === "problem");
  const top = probs[0] ?? null;
  const next = top ?? todo[0] ?? null;
  const great = v.great.filter((g) => !decided[g.key])[0];
  const others = byGoalSpend(v).slice(3);
  const chartGoal = byGoalSpend(v).find((o) => o.mode !== "cpm" && o.results > 0);
  const series = chartGoal ? { resultLabel: chartGoal.resultLabel, days: chartGoal.daily.map((d) => ({ date: d.date, results: d.results })) } : null;
  let takeaway = "";
  if (series) {
    const inP = series.days.filter((d) => d.date >= v.from && d.date <= v.to);
    const best = inP.length ? inP.reduce((b, d) => (d.results > b.results ? d : b)) : null;
    const wd = Array.from({ length: 7 }, () => ({ r: 0, n: 0 }));
    for (const d of series.days) { wd[D0(d.date).getUTCDay()].r += d.results; wd[D0(d.date).getUTCDay()].n++; }
    const bestWd = wd.map((x, i) => ({ i, avg: x.n ? x.r / x.n : 0 })).sort((p, q) => q.avg - p.avg)[0];
    takeaway = `${best && best.results > 0 ? `Your best day was <b>${fmtDay(best.date)}</b> with ${n0(best.results)} ${esc(chartGoal.resultLabel)}. ` : ""}Over the last 4 weeks, <b>${WEEKDAYS[bestWd.i]}</b> was usually your best day.`;
  }
  return `
  <section class="hero ${st.tone}" aria-labelledby="ok-h">
    <span class="label">Am I doing OK?</span>
    <h2 id="ok-h">${st.headline}</h2>
    <p class="say">${spend}</p>
    <ul class="plaingoals">${st.lines.map((g) => `<li><span class="ico ${g.tone}" aria-hidden="true">${ICONCH[g.tone]}</span><span>${g.text}</span></li>`).join("")}
      ${ui.begMoreGoals ? others.map((o) => plainGoal(o, v)).map((g) => `<li><span class="ico ${g.tone}" aria-hidden="true">${ICONCH[g.tone]}</span><span>${g.text}</span></li>`).join("") : ""}</ul>
    ${others.length ? `<p><button class="link" type="button" data-begmoregoals>${ui.begMoreGoals ? "Show only my main goals" : `Show my ${plural(others.length, "smaller goal")}`}</button></p>` : ""}
  </section>
  <section class="section" aria-labelledby="bp-h">
    ${sectionHead(top ? "Fix this first" : "Your next step", top ? "The most urgent problem, and how to fix it step by step" : "No problems found. Here’s the best thing to do next.")}
    ${next ? tcard(next, 0, { big: true }) : emptyState("Nothing needs doing right now", "AdMate checks again after your next upload.")}
    ${todo.length > 1 ? `<p><button class="link" type="button" data-go="todo">${plural(todo.length - 1, "more thing")} to do →</button></p>` : ""}
  </section>
  ${great ? `<section class="section" aria-labelledby="gw-h">${sectionHead("What’s working", "")}<div class="gcard"><span class="tag good">Doing great</span><span class="t">${esc(great.campaign)}</span><p>${esc(plain(firstSentence(great.why)))}</p><p class="do"><b style="font-weight:500">You could:</b> ${esc(plain(firstSentence(great.action)))}</p><div><button class="btn small" type="button" data-key="${esc(great.key)}">Explain more</button></div></div></section>` : ""}
  ${series ? `<section class="section" aria-labelledby="ch-h">${sectionHead(`Your ${esc(chartGoal.resultLabel)} per day`, `${esc(chartGoal.label)}, last 4 weeks`)}<div class="chartbox">${simpleBars(series, v.from, v.to)}<p class="cap">${takeaway}</p></div></section>` : ""}
  <details class="more"><summary>Words you’ll see in AdMate</summary><div class="words">
    <div><b>Cost per result</b>What one result (a message, a lead, a sale) cost you in ads, on average. Lower is better.</div>
    <div><b>Sales per $1 spent (ROAS)</b>How much you sold for each $1 of ads. Higher is better.</div>
    <div><b>Click rate (CTR)</b>Out of everyone who saw your ad, the share who clicked it.</div>
    <div><b>Goal</b>The cost (or return) you’re aiming for. Set it in Goals &amp; settings.</div>
  </div></details>`;
}

function begTodo() {
  const v = V();
  const list = decisions(v);

    ${watching ? `<p class="small-note">AdMate is also keeping an eye on ${plural(watching, "smaller thing")}. Nothing to do about them yet.</p>` : ""}

const CAMP_TAG = { issue: ["bad", "Needs attention"], opportunity: ["good", "Doing great"], on_track: ["good", "On track"], learning: ["flat", "Too early to tell"], waiting: ["flat", "Too early to tell"], signal: ["flat", "Keep an eye on it"] };
const campGroup = (r) => (r.kind === "issue" ? "attention" : r.kind === "opportunity" || r.kind === "on_track" ? "well" : "early");
function begMyAds() {
  const v = V();
  const rows = [...v.levels.campaign].sort((a, b) => (PRIO_RANK[a.priority] ?? 9) - (PRIO_RANK[b.priority] ?? 9) || b.spend - a.spend);
