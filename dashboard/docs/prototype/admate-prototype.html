  const list = f === "all" ? rows : rows.filter((r) => campGroup(r) === f);
  return `<section class="section">
    ${sectionHead("My ads", `${esc(v.label)} · tap a campaign to see what to do`)}
    <div class="filters" role="group" aria-label="Show">${[["all", `All (${rows.length})`], ["attention", `Needs attention (${count("attention")})`], ["well", `Doing well (${count("well")})`], ["early", `Too early to tell (${count("early")})`]].map(([k, l]) => `<button type="button" data-myads="${k}" aria-pressed="${k === f}">${l}</button>`).join("")}</div>
    ${list.length ? `<div class="grid3">${list.map((r) => {
      const [tone, word] = CAMP_TAG[r.kind] ?? ["flat", "No verdict yet"];
      const each = r.kpi == null ? "no results yet" : r.mode === "roas" ? `$${r.kpi.toFixed(2)} back in sales for every $1` : r.mode === "cpm" ? `${money(r.kpi)} per 1,000 views` : `${money(r.kpi)} per ${esc(singular(r))}`;

      return `<button class="ccard" type="button" data-entity="campaign:${esc(r.id)}"><span class="tag ${tone}">${word}</span><span class="t">${esc(r.name)}</span>
        <p>${r.mode === "cpm" ? "" : `${n0(r.results)} ${esc(r.resultLabel)} · `}${each}</p>
        ${exp ? `<p class="small-note">${exp}</p>` : ""}
        <p class="small-note">Spent ${money(r.spend)} · ${pct(r.share)} of your ad budget · ${PLATFORM[r.platform]}</p>
        ${r.label ? `<p><b style="font-weight:500">Next:</b> ${esc(plain(r.label))}</p>` : ""}</button>`;
    }).join("")}</div>` : emptyState("Nothing here", "No campaign in this group for this period.")}
  </section>`;
}

// ===== ui/30-intermediate.js =====
// Intermediate · Analyze & optimize. For people who run their own ads: what changed
// and WHY (which of ad cost, click rate and conversion rate drove it), optimizations
// ranked by money at stake with an "investigate" flow, and side-by-side comparisons
// of campaigns, audiences and creatives.

const OFF = ["far_off", "off_track", "worse"];
const impactWord = (mode, worse) => (mode === "roas" ? (worse ? "lost revenue" : "extra revenue") : worse ? "extra cost" : "saved");

// Open problems and opportunities, ranked by the money they involve (looking back).
function optimizeQueue(v, filter = "open", sort = "impact") {
  let list;
  if (filter === "done") return [...allItems(v), ...Object.values(v.details)].filter((d, i, arr) => decided[d.key] && arr.findIndex((x) => x.key === d.key) === i);
  if (filter === "fix") list = v.problems;
  else if (filter === "grow") list = v.opportunities;
  else if (filter === "watch") list = v.signals;
  else list = [...v.problems, ...v.opportunities];
  list = list.filter((d) => isOpen(d) && shown(d));
  const known = (d) => (d.impact?.known ? d.impact.amount : -1);
  const by = {
    impact: (x, y) => known(y) - known(x) || PRIO_RANK[x.priority] - PRIO_RANK[y.priority],
    priority: (x, y) => PRIO_RANK[x.priority] - PRIO_RANK[y.priority] || known(y) - known(x),
    confidence: (x, y) => CONF_RANK[x.confidence] - CONF_RANK[y.confidence] || known(y) - known(x),
  }[sort];
  return [...list].sort(by);
}
function orow(d, i, v = V()) {
  const dec = decided[d.key];
  const r = rowOf(d.entity, v);
  return `<button class="irow orow ${d.priority}${dec ? " closed" : ""}" type="button" data-key="${esc(d.key)}">
    <span class="n">${i + 1}</span>
    <span class="body"><span class="tags">${prioChip(d.priority)}${kindTag(kindOf(d))}${plat(d.platform)}${driverChip(r?.drivers)}</span>
      <span class="t">${esc(d.title)}</span>${d.where ? `<span class="path">${pathHtml(d.where)}</span>` : ""}${dec ? `<span class="sub">${esc(STATUS_TEXT(dec))}</span>` : ""}</span>
    <span class="side-r">${impactChip(d)}${confLabel(d.confidence)}<span class="link small">Investigate →</span></span>
  </button>`;
}

function goalTile(o, v) {

}

// Why one item beats another, from the same metric tree the engine uses:
// cost per result = CPM ÷ (1000 × CTR × conversion rate); ROAS adds order value.
function keyDifference(a, b) {
  const better = (higher(a.mode) ? a.kpi >= b.kpi : a.kpi <= b.kpi) ? a : b;
  const worse = better === a ? b : a;
  if (better.kpi == null || worse.kpi == null || better.kpi === worse.kpi) return "";
  const terms = [];
  const add = (key, label, vb, vw, sign, fmt) => { if (vb > 0 && vw > 0) terms.push({ key, label, val: sign * Math.log(vb / vw), vb, vw, fmt }); };
  add("cpm", "showing the ads costs less", better.cpm, worse.cpm, -1, money);
  if (better.cvr != null && worse.cvr != null) {
    add("ctr", "more of the people who see it click", better.ctr, worse.ctr, 1, (x) => pct(x, 2));
    add("cvr", "more of the people who click go on to act", better.cvr, worse.cvr, 1, (x) => pct(x, 1));
  } else {
    add("rate", "more of the people who see it act", better.results / better.impressions, worse.results / worse.impressions, 1, (x) => pct(x, 2));
  }
  if (better.mode === "roas" && better.results > 0 && worse.results > 0) add("aov", "each order is worth more", better.revenue / better.results, worse.revenue / worse.results, 1, money);
  const m = terms.sort((x, y) => y.val - x.val)[0];
  if (!m || m.val <= 0) return "";
  const gap = higher(better.mode) ? better.kpi / worse.kpi - 1 : 1 - better.kpi / worse.kpi;
  return `“${esc(better.name)}” does ${Math.round(gap * 100)}% better than “${esc(worse.name)}” on ${esc(better.kpiShort)}, mainly because ${m.label} (${m.fmt(m.vb)} vs ${m.fmt(m.vw)}).`;
}
function overlayChart(list, from, to) {
  const ser = list.filter((x) => x.series && x.series.days.length > 1);
  if (!ser.length) return "";
  const W = 640, H = 190, L0 = 50, R = 12, T0 = 14, B = 26;
  const n = ser[0].series.days.length;
  const all = ser.flatMap((s) => s.series.days.map((d) => d.kpi)).filter((x) => x != null && x > 0);
  const max = (all.length ? Math.max(...all) : 1) * 1.12;
  const x = (i) => L0 + (i / Math.max(1, n - 1)) * (W - L0 - R), y = (v) => H - B - (v / max) * (H - T0 - B);
  const colors = ["var(--violet)", "var(--c2)", "var(--c3)"], dash = ["", "6 4", "2 3"];
  const ds = ser[0].series.days;
  const i0 = ds.findIndex((d) => d.date >= from), i1 = ds.length - 1 - [...ds].reverse().findIndex((d) => d.date <= to);
  const lines = ser.map((s, k) => { let p = ""; s.series.days.forEach((d, i) => { if (d.kpi == null || d.kpi <= 0) return; p += (p && s.series.days[i - 1]?.kpi > 0 ? "L" : "M") + x(i).toFixed(1) + "," + y(d.kpi).toFixed(1) + " "; }); return `<path d="${p}" fill="none" stroke="${colors[k]}" stroke-width="2" stroke-dasharray="${dash[k]}" stroke-linejoin="round"/>`; }).join("");
  const step = Math.max(1, Math.ceil(n / 7));
  return `<div class="chartbox"><span class="title">${T(ser[0].series.kpiShort)} per day</span><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Main result per day for each compared item">
    ${i0 >= 0 ? `<rect x="${x(i0)}" y="${T0 - 6}" width="${Math.max(2, x(i1) - x(i0))}" height="${H - T0 - B + 6}" fill="var(--violet-soft)"/>` : ""}
    ${[0, max / 2, max].map((vv) => `<line x1="${L0}" x2="${W - R}" y1="${y(vv)}" y2="${y(vv)}" stroke="var(--line)" stroke-width="0.8"/><text x="${L0 - 6}" y="${y(vv) + 3}" text-anchor="end" font-size="9.5" fill="var(--muted)">${kpi(vv, ser[0].series.mode)}</text>`).join("")}
    ${lines}
    ${ds.map((d, i) => (i % step === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${fmtDate(d.date)}</text>` : "")).join("")}
  </svg><div class="legend">${ser.map((s, k) => `<span><svg width="22" height="8" aria-hidden="true"><line x1="0" x2="22" y1="4" y2="4" stroke="${colors[k]}" stroke-width="2.5" stroke-dasharray="${dash[k]}"/></svg>${esc(s.name)}</span>`).join("")}<span><i class="sw" style="background:var(--violet-soft)"></i>selected period</span></div></div>`;
}
function openCompare() {
  const v = V();
  const items = [...ui.compare].map((k) => { const [lv, id] = k.split(":"); return v.levels[lv]?.find((r) => r.id === id); }).filter(Boolean);
  if (items.length < 2) return toast("Tick 2 or 3 rows to compare");
  const same = items.every((r) => r.objective === items[0].objective && r.mode === items[0].mode);
  const best = (vals, hi) => { const xs = vals.filter((x) => x != null); return xs.length ? (hi ? Math.max(...xs) : Math.min(...xs)) : null; };
  const metric = (label, get, fmt, hi) => {
    const vals = items.map(get);
    const b = hi == null ? null : best(vals, hi), w = hi == null ? null : best(vals, !hi);
    return `<tr><th scope="row" style="position:static;text-transform:none;letter-spacing:0;font-family:var(--font-display);font-size:13px">${label}</th>${vals.map((x) => `<td class="r num ${hi != null && x != null && vals.filter((y) => y != null).length > 1 && x === b ? "best" : hi != null && x != null && x === w && b !== w ? "worst" : ""}">${fmt(x)}</td>`).join("")}</tr>`;
  };
  const kpiRow = same ? metric(T(items[0].kpiShort), (r) => r.kpi, (x) => kpi(x, items[0].mode), higher(items[0].mode)) : `<tr><th scope="row" style="position:static;text-transform:none;letter-spacing:0;font-family:var(--font-display);font-size:13px">Main result</th>${items.map((r) => `<td class="r num">${T(r.kpiShort)} ${kpi(r.kpi, r.mode)}</td>`).join("")}</tr>`;
  const ranked = items.filter((r) => r.kpi != null).sort((a, b) => (higher(a.mode) ? b.kpi - a.kpi : a.kpi - b.kpi)); // best first
  const diff = same && ranked.length >= 2 ? keyDifference(ranked[0], ranked[ranked.length - 1]) : "";
  const series = items.map((r) => ({ name: r.name, series: E.daily(r.level, r.id, v.from, v.to, acct) }));

}

// ---------- Audiences & creatives ----------
function creativesHtml(v) {
  const sets = v.levels.ad_group.filter((s) => v.levels.ad.filter((a) => a.adSetId === s.id).length >= 2).sort((a, b) => b.spend - a.spend);
  if (!sets.length) return emptyState("No ad sets with two or more ads", "Creatives are compared within an ad set, where they share the same audience and budget.");
  // Same rule as the engine: ads are compared with their siblings only when the
  // siblings have at least 10 results between them.
  const vsSiblings = (a, sib) => {
    const others = sib.filter((x) => x.id !== a.id);
    if (others.reduce((s, x) => s + x.results, 0) < 10) return `<span class="muted" title="The other ads in this ad set have fewer than 10 results, so AdMate compares this ad with its own past instead.">too few results</span>`;
    const spend = others.reduce((s, x) => s + x.spend, 0);
    const val = a.mode === "roas" ? others.reduce((s, x) => s + x.revenue, 0) / (spend || 1) : others.reduce((s, x) => s + x.results, 0) > 0 ? spend / others.reduce((s, x) => s + x.results, 0) : null;
    if (val == null || a.kpi == null || val <= 0) return "—";
    const idx = higher(a.mode) ? a.kpi / val : val / a.kpi;
    return `<span class="delta ${idx >= 1.1 ? "good" : idx <= 0.9 ? "bad" : "flat"}">${idx >= 1 ? `${Math.round((idx - 1) * 100)}% better` : `${Math.round((1 - idx) * 100)}% worse`}</span>`;
  };
  return `${v.reuse.length ? `<div class="card pad" style="display:grid;gap:8px"><span>${src("read")} <b style="font-weight:500">Ads worth copying</b></span><ul style="margin:0;padding-left:18px;display:grid;gap:4px">${v.reuse.map((r) => `<li><button class="link" type="button" data-key="${esc(r.key)}">${esc(r.name)}</button> <span class="small-note">(${esc(r.where)})</span>: ${esc(r.why)}</li>`).join("")}</ul></div>` : ""}
  <div class="tablewrap"><table class="tbl" style="min-width:820px"><thead><tr><th>Ad</th><th class="r">Spend</th><th class="r">Main result</th><th class="r">vs others in its ad set</th><th class="r">${T("CTR")}</th><th class="r">${T("Conversion rate")}</th><th>AdMate’s call</th></tr></thead><tbody>
  ${sets.slice(0, 12).map((s) => { const ads = v.levels.ad.filter((a) => a.adSetId === s.id).sort((a, b) => b.spend - a.spend); return `<tr class="grouphead"><td colspan="7"><span class="lvl">Ad set</span> ${esc(s.name)} <span class="small-note">· in ${esc(s.campaignName)}</span></td></tr>${ads.map((a) => `<tr class="click" data-row="ad:${esc(a.id)}"><td><div class="nm">${esc(a.name.split(" · ").pop())}</div></td><td class="r num">${money(a.spend)}</td><td class="r num">${T(a.kpiShort)} ${kpi(a.kpi, a.mode)}</td><td class="r">${vsSiblings(a, ads)}</td><td class="r num">${pct(a.ctr, 2)}</td><td class="r num">${pct(a.cvr, 1)}</td><td>${a.stance === "scale" || a.stance === "cut" ? `<b style="font-weight:500">${esc(a.label)}</b>` : esc(a.label ?? "")}${a.yardKind && a.yardKind !== "others" ? `<div class="small-note">${a.yardKind === "target" || a.yardKind === "break_even" ? "vs your target" : "vs its own past"}</div>` : a.yardKind === "others" ? '<div class="small-note">vs the other ads</div>' : ""}</td></tr>`).join("")}`; }).join("")}
  </tbody></table></div>
  <p class="small-note">Ads are only compared with the other ads in the same ad set: they share its audience and budget, like a creative test.</p>`;
}
function intAudCreatives() {
  const v = V();
  return `<section class="section">
    <div class="tabs" role="tablist" aria-label="Audiences or creatives">${[["audiences", "Audiences"], ["creatives", "Creatives (ads)"]].map(([k, l]) => `<button type="button" role="tab" data-audtab="${k}" aria-selected="${ui.audTab === k}">${l}</button>`).join("")}</div>
    ${ui.audTab === "creatives" ? creativesHtml(v) : audienceHtml()}

// ---------- Portfolio: all accounts ----------
function acctSummary(id) {
  const v = V(id);
  const tg = targetsFor(id);
  const goals = byGoalSpend(v);
  const main = goals[0] ?? null;
  const g = main ? goalOf(main, tg) : null;
  const off = goals.filter((o) => OFF.includes(goalOf(o, tg).state)).length;
  const probs = v.problems.filter((d) => isOpen(d) && shown(d));
  const high = probs.filter((d) => d.priority === "high");
  const atStake = probs.reduce((s, d) => s + (d.impact?.known ? d.impact.amount : 0), 0);
  const top = [...probs].sort((a, b) => PRIO_RANK[a.priority] - PRIO_RANK[b.priority] || byImpact(a, b))[0] ?? null;
  const opps = v.opportunities.filter((d) => isOpen(d) && shown(d));
  const tone = high.length || (g && TONE[g.state] === "bad") ? "bad" : probs.length || off ? "warn" : "good";
  return { id, v, goals, main, g, off, probs, high, atStake, top, opps, tone };
}

    ${all.map((x) => { const a = ACCTS.find((y) => y.id === x.id); const [gc, gw] = x.g ? STATE[x.g.state] : ["flat", "—"]; return `<tr class="click" data-acctgo="${x.id}" tabindex="0">
      <td><div class="nm">${esc(a.name)}</div><div class="sub">${esc([a.industry, a.country].filter(Boolean).join(" · "))}</div></td>
      <td><span class="tag ${x.tone === "bad" ? "bad" : x.tone === "warn" ? "warn" : "good"}">${TONE_WORD[x.tone]}</span></td>
      <td class="r"><div class="num">${money(x.v.spend)}</div>${deltaChip(x.v.spendChange, "neutral")}</td>
      <td>${x.main ? `<div>${esc(x.main.label)} · <span class="num">${esc(x.main.kpiShort)} ${kpi(x.main.value, x.main.mode)}</span></div><div class="sub"><span class="state ${gc}">${gw}</span>${x.g.target != null ? `target ${kpi(x.g.target, x.main.mode)}` : "no target"}</div>` : "—"}</td>
      <td class="r num">${x.off} of ${x.goals.length}</td>

    </tr>`; }).join("")}

// ---------- Budget: where the money goes, goal by goal ----------
// Click a goal (Sales, Messages, …) and every campaign with that goal shows its
// spending: amount, share, per day, results, a daily spend chart and AdMate's call.
const CAT = ["var(--cat1)", "var(--cat2)", "var(--cat3)", "var(--cat4)", "var(--cat5)", "var(--cat6)", "var(--cat7)"];
const BUDGET_CALL = { scale: ["good", "Add budget"], cut: ["bad", "Spend less"], fix: ["warn", "Fix first, then add"], keep: ["flat", "Keep as is"], average: ["flat", "Keep as is"], learn: ["flat", "Too early to tell"], wait: ["flat", "Too early to tell"], watch: ["flat", "Watch"], reuse: ["flat", "Ended: reuse"], avoid: ["flat", "Ended: avoid"] };
function spendChart(rows, series, from, to) {
  const first = series.find(Boolean);
  if (!first || first.days.length < 2) return "";
  const dates = first.days.map((d) => d.date);
  const top = rows.slice(0, 6), rest = rows.slice(6);
  const spendOn = (r, i) => series[rows.indexOf(r)]?.days[i]?.spend ?? 0;
  const byDay = dates.map((date, i) => ({ date, parts: [...top.map((r) => spendOn(r, i)), ...(rest.length ? [rest.reduce((s, r) => s + spendOn(r, i), 0)] : [])] }));
  const names = [...top.map((r) => r.name), ...(rest.length ? [`${rest.length} other campaigns`] : [])];
  const max = Math.max(1, ...byDay.map((d) => d.parts.reduce((s, x) => s + x, 0))) * 1.12;
  const W = 640, H = 200, L0 = 52, R = 8, T0 = 12, B = 26;
  const bw = (W - L0 - R) / byDay.length;
  const y = (val) => H - B - (val / max) * (H - T0 - B);
  const i0 = dates.findIndex((d) => d >= from), i1 = dates.length - 1 - [...dates].reverse().findIndex((d) => d <= to);
  const bars = byDay.map((d, i) => { let acc = 0; return d.parts.map((x, k) => { const y1 = y(acc + x), h = y(acc) - y1; acc += x; return h > 0.2 ? `<rect x="${(L0 + i * bw + bw * 0.12).toFixed(1)}" y="${y1.toFixed(1)}" width="${(bw * 0.76).toFixed(1)}" height="${h.toFixed(1)}" fill="${CAT[k % CAT.length]}"><title>${fmtDay(d.date)} · ${esc(names[k])}: ${money(x)}</title></rect>` : ""; }).join(""); }).join("");
  const step = Math.max(1, Math.ceil(byDay.length / 7));
  return `<div class="chartbox"><span class="title">Daily spending, by campaign <span class="small-note">(last 4 weeks; hover a bar for the amount)</span></span><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spend by campaign">
    ${i0 >= 0 ? `<rect x="${L0 + i0 * bw}" y="${T0 - 6}" width="${(i1 - i0 + 1) * bw}" height="${H - T0 - B + 6}" fill="var(--violet-soft)"/>` : ""}
    ${[0, max / 2, max].map((val) => `<line x1="${L0}" x2="${W - R}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)" stroke-width="0.8"/><text x="${L0 - 6}" y="${y(val) + 3}" text-anchor="end" font-size="9.5" fill="var(--muted)">${money(val)}</text>`).join("")}
    ${bars}
    ${dates.map((d, i) => (i % step === 0 || i === dates.length - 1 ? `<text x="${L0 + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${fmtDate(d)}</text>` : "")).join("")}
  </svg><div class="legend">${names.map((n, k) => `<span><i class="sw" style="background:${CAT[k % CAT.length]}"></i>${esc(n)}</span>`).join("")}<span><i class="sw" style="background:var(--violet-soft)"></i>selected period</span></div></div>`;
}

  </section>`;

const ASST_ERR = {
  not_granted: "This page isn’t allowed to use Claude, so the Assistant can’t answer. Reload the page to be asked again.",
  sampling_disabled: "Claude isn’t available for this account.",
  rate_limited: "That’s a lot of questions in a short time. Please try again in a little while.",
  session_expired: "Your Claude session expired. Sign in again, then ask.",
  refused: "I can’t answer that one. Try asking about your campaigns, results or recommendations.",
  prompt_too_large: "That was too much to read at once. Try a shorter question or start a new chat.",
};
async function asstSend(q) {
  q = String(q ?? "").trim();
  if (!q || asst.busy || !sampleFn) return;
  asst.turns.push({ role: "user", content: q });
  asst.busy = true; asst.live = "";
  renderAsst();
  const ctl = new AbortController(); asst.ctl = ctl;
  const history = asst.turns.filter((t) => t.role !== "error").slice(-10);
  try {
    const { text, truncated } = await sampleFn([{ role: "user", content: asstRules() }, ...history], {
      cache: false, signal: ctl.signal,
      onText: ({ text }) => { asst.live = text; const el = $("#asstLive"); if (el) { el.innerHTML = md(text); const m = $("#asstMsgs"); if (m) m.scrollTop = m.scrollHeight; } },
    });
    asst.turns.push({ role: "assistant", content: text + (truncated ? "\n\n(Cut short. Ask for less at a time.)" : "") });
  } catch (e) {
    if (e?.text) asst.turns.push({ role: "assistant", content: e.text + (e.code === "cancelled" ? "\n\n(Stopped.)" : "") });
    if (e?.code !== "cancelled") asst.turns.push({ role: "error", content: ASST_ERR[e?.code] ?? "Something went wrong. Please try again." });
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") sampleFn = null;
  } finally {
    asst.busy = false; asst.ctl = null; asst.live = "";
    renderAsst();
    $("#asstIn")?.focus();
  }
}

  if (d.undo) { decideKey(d.undo, "restore"); return render(); }
  if (d.deeper) { const it = detailOf(d.deeper); return openDrawer(it, { depth: "intermediate" }); }

    return render();
  }
  if (t.id === "xGroup") { ui.ex.group = t.value; ui.ex.active = null; return render(); }
  if (t.id === "xObj") { ui.ex.obj = t.value; ui.ex.active = null; return render(); }
  if (t.id === "xPlat") { ui.ex.plat = t.value; ui.ex.active = null; return render(); }
  if (t.id === "xPrio") { ui.ex.prio = t.value; ui.ex.active = null; return render(); }
  if (t.id === "xIssues") { ui.ex.issues = t.checked; ui.ex.active = null; return render(); }
  if (d.col) { const c = ui.ex.cols; if (t.checked) { if (!c.includes(d.col)) c.push(d.col); } else ui.ex.cols = c.filter((x) => x !== d.col); ui.ex.active = null; return render(); }
  if (d.xsel) { t.checked ? ui.ex.sel.add(d.xsel) : ui.ex.sel.delete(d.xsel); return render(); }
  if (t.hasAttribute("data-xsel-all")) { $$("[data-xsel]").forEach((c) => (t.checked ? ui.ex.sel.add(c.dataset.xsel) : ui.ex.sel.delete(c.dataset.xsel))); return render(); }
  if (d.ruleon) { putRules(rules().map((r) => (r.id === d.ruleon ? { ...r, on: t.checked } : r))); return render(); }
  if (d.mute) { t.checked ? muted.delete(d.mute) : muted.add(d.mute); LS.put("admate-muted", [...muted]); return render(); }
  if (d.auto) { putAuto(d.auto === "sens" ? { sens: t.value } : { [d.auto]: t.checked }); return render(); }
  if (t.id === "autoPct") { const n = Math.round(Number(t.value)); if (n >= 1 && n <= 300) putAuto({ pct: n }); else toast("Enter a percentage between 1 and 300"); return render(); }
  if (d.ctarget) {
    const all = ownTargets(); const n = parseFloat(String(t.value).replace(/[^\d.]/g, ""));
    if (n > 0) all[d.ctarget] = { value: n, mode: d.ctmode }; else delete all[d.ctarget];
    LS.put(ctKey(), all);
    const r = V().levels.campaign.find((x) => x.id === d.ctarget);
    toast(n > 0 ? "Campaign target saved" : r && goalTarget(r) != null ? "This campaign now uses the goal’s target" : "Campaign target removed");
    return render();
  }
  if (d.tg === "on") { putTg({ on: t.checked }); return render(); }
  if (t.name === "tgwhen") { putTg({ when: t.value }); return render(); }
  if (d.tgday) { const day = Number(d.tgday); const ds = new Set(tgCfg().days); t.checked ? ds.add(day) : ds.delete(day); putTg({ days: [...ds] }); return render(); }
  if (t.id === "tgTime") { putTg({ time: t.value || "09:00" }); return render(); }
  if (t.id === "tgUser") { const u = t.value.trim(); putTg({ user: u && !u.startsWith("@") ? "@" + u : u }); return render(); }
  if (t.id === "audTarget") { ui.aud.target = t.value; return render(); }
  if (t.id === "rMetric") { const op = $("#rOp"); if (t.value === "worse") op.value = "by"; else if (op.value === "by") op.value = "above"; return; }
  if (d.role) { roles[d.role] = t.value; return toast(`Funnel role set to ${ROLE[t.value]}. In the app AdMate then compares it only with ${ROLE[t.value].toLowerCase()} campaigns.`); }
  if (d.objsel) { objectiveOverride[d.objsel] = t.value; return toast(`Goal set to ${M().allObjectives.find((o) => o.objective === t.value).label}. In the app AdMate re-judges it with that goal’s result.`); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "actQ" || t.id === "xQ") {
    if (t.id === "actQ") ui.actQ = t.value; else { ui.ex.q = t.value; ui.ex.active = null; }
    focusAfter = { id: t.id, pos: t.selectionStart ?? t.value.length };
    return render();
  }
  const o = t.dataset.o;
  if (!o) return;
  const draft = { ...targetsFor()[o] };
  $$(`input[data-o="${o}"]`).forEach((i) => { const v = parseFloat(i.value); draft[i.dataset.f] = v > 0 ? v : null; });
  const be = breakEven(draft), p = $("#be-" + o);
  p.hidden = be == null;
  if (be != null) p.querySelector("b").textContent = draft.mode === "roas" ? `ROAS ${be.toFixed(2)}×` : `${draft.kpiShort} ${money(be)}`;
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "asstForm") return asstSend($("#asstIn").value);
  if (f.id === "targetsForm") {
    $$("#targetsForm input[data-o]").forEach((i) => { const v = parseFloat(i.value); targetsFor()[i.dataset.o][i.dataset.f] = v > 0 ? v : null; });
    toast("Goals saved. Every page re-judges them now.");
    return render();
  }
  if (f.id === "addForm") {
    const name = $("#newName").value.trim();
    if (!name) { $("#addError").textContent = "Enter your business or brand name first."; return $("#newName").focus(); }
    toast(`In the app, “${name}” would be created now. This prototype only has the sample accounts.`);
    return go("upload");
  }
  if (f.id === "ruleForm") {
    const metric = $("#rMetric").value, op = $("#rOp").value, value = parseFloat($("#rValue").value), scope = $("#rScope").value;
    const err = (m) => { $("#rErr").textContent = m; };
    if (!(value >= 0)) return err("Enter a number.");
    if (metric === "worse" && op !== "by") return err("Use “is worse by more than” for this one.");
    if (metric !== "worse" && op === "by") return err("Use “is above” or “is below”.");
    if (RULE_METRICS[metric].needsScope && scope === "all") return err("Pick a goal or a campaign: cost per result and ROAS can’t share one limit.");
    putRules([...rules(), { id: Date.now().toString(36), metric, op, value, scope, on: true }]);
    toast("Rule added");
    return render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "asstIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); return asstSend(e.target.value); }
  if (e.key === "Escape") {
    if ($(".onboard") && !xp) return;
    if (openPop) { openPop = null; return renderSwitchers(); }
    closeOverlay(); closePicker();
  }
  if (e.key === "Enter" && e.target.matches("tr[data-row], tr[data-acctgo], tr[data-trend], tr[data-key]")) e.target.click();
  // Advanced: "/" jumps to search.
  if (e.key === "/" && isAdv() && !e.target.matches("input, textarea, select")) { const s = $("#xQ") ?? $("#actQ"); if (s) { e.preventDefault(); s.focus(); } }
});

// ---------- start ----------
try {
  view = HOME[L()];
  render();
  renderAsst();
  if (!xp) openOnboard();
} catch (err) {
  console.error(err);
  $("#pages").innerHTML = `<div class="empty"><b>The AdMate engine couldn’t start in this browser</b>${esc(err.message)}</div>`;
}
</script>
